# Pipeline del microservicio de IA (servicio-ia). EP3.
#
#   Pull request a dev o main -> tests + build + prueba de humo del contenedor (NO publica)
#   Push a main (merge de dev) -> lo mismo y publica en GHCR: ghcr.io/<cuenta>/servicio-ia:sha-xxxxxxx y :latest
#   Tag ep3                    -> lo mismo y publica ademas con el tag ep3 (el que usa el compose.yaml en la EC2).
#
# EP3: el modelo ya NO se entrena ni viaja en esta imagen. La red vive en un endpoint de SageMaker, que se crea con los
# scripts de sagemaker/ (reproducibles, desde CloudShell). Este servicio solo lo invoca con el rol de la EC2, asi que el
# pipeline no necesita TensorFlow ni credenciales de AWS: los tests usan un doble del endpoint.
name: servicio-ia

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: [ep3]
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # para publicar la imagen en GHCR

jobs:
  probar-construir-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicio-ia/requirements-dev.txt

      - name: Dependencias del servicio (sin TensorFlow ni onnxruntime)
        run: pip install -r servicio-ia/requirements-dev.txt

      - name: Tests del servicio (con el endpoint de SageMaker simulado)
        working-directory: servicio-ia
        run: python -m pytest -q tests

      - name: Nombre de la imagen (GHCR exige minusculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/servicio-ia" >> "$GITHUB_ENV"

      - name: Tags y etiquetas (incluye org.opencontainers.image.revision)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: servicio-ia
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            servicio-ia:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}

      - name: Prueba de humo del contenedor (health + camino de falla + tamano < 1 GB)
        # Aqui no hay credenciales de AWS ni endpoint: /health responde 200 (leyo su referencia) y dice que SageMaker
        # no es alcanzable; /predict responde 503, NO 500 (el dominio lo traduce en su politica de reserva).
        run: |
          docker run -d --name ia -p 8000:8000 servicio-ia:ci
          for i in $(seq 1 40); do curl -sf localhost:8000/health && break; sleep 2; done
          echo
          curl -s localhost:8000/health
          echo
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"monto_usd":52,"hora_local":25,"intentos_previos_1h":5,"dispositivo_usuarios_distintos":4,"sin_dispositivo":false,"pais_extranjero":true,"canal":"web"}')
          echo "POST /predict con hora_local=25 (invalida) -> $CODIGO (se espera 422)"
          [ "$CODIGO" = "422" ]
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"monto_usd":52,"hora_local":3,"intentos_previos_1h":5,"dispositivo_usuarios_distintos":4,"sin_dispositivo":false,"pais_extranjero":true,"canal":"web"}')
          echo "POST /predict sin SageMaker -> $CODIGO (se espera 503)"
          [ "$CODIGO" = "503" ]
          BYTES=$(docker image inspect servicio-ia:ci --format '{{.Size}}')
          echo "Tamano de la imagen: $((BYTES / 1024 / 1024)) MB"
          if [ "$BYTES" -gt 1073741824 ]; then echo "::error::La imagen supera 1 GB"; exit 1; fi
          echo "revision: $(docker image inspect servicio-ia:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          docker rm -f ia

      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en GHCR (push a main o tag ep3)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do docker push "$tag"; done
