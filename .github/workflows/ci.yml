# Pipeline de gateway, front, dominio y carga-datos (enunciado 2.5). Mismo patron del L4, sin el deploy por SSH:
# primero las pruebas y, solo si pasan (needs:), la construccion y publicacion de las imagenes.
# El microservicio de IA tiene su propio workflow: servicio-ia.yml.
#
#   Pull request hacia dev o main -> pruebas + build de las 4 imagenes, SIN publicar
#   Push a main (merge desde dev) -> lo mismo y publica en GHCR con los tags sha-xxxxxxx y latest
#   Tag ep2                       -> lo mismo y publica con el tag ep2 (el que usa el compose.yaml de la defensa)
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: [ep2]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Pruebas. Si algo falla, el job termina en rojo y "imagenes" no se ejecuta.
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:                       # una base real, la misma imagen del compose
        image: postgres:16-alpine
        env:
          POSTGRES_USER: randuin
          POSTGRES_PASSWORD: randuin_local
          POSTGRES_DB: randuin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U randuin -d randuin_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_URL: postgresql://randuin:randuin_local@localhost:5432/randuin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: pip install -r datos/requirements.txt -r carga-datos/requirements.txt -r dominio/requirements.txt
      - name: Tratamiento de datos (deja las tablas tratadas en carga-datos/tratados)
        run: python datos/preparar.py
      - name: "Test del tratamiento: sin duplicados ni nulos en columnas clave"
        run: python -m pytest -q datos/tests
      - name: "Test de carga-datos: cargar dos veces no duplica filas"
        run: python -m pytest -q carga-datos/tests
      - name: "Test del dominio: reglas, lista negra, reserva y validaciones"
        run: python -m pytest -q dominio/tests
      - name: "Test del gateway: rutas y API key"
        run: node gateway/prueba.js
      - name: "Test del front: formulario y rutas por el gateway"
        run: node front/prueba.js
      - name: "Test de las figuras: la figura 4 tiene los mismos servicios que el compose.yaml"
        run: python -m pytest -q docs/tests
      - name: Guardar las tablas tratadas para la imagen de carga-datos
        uses: actions/upload-artifact@v4
        with:
          name: tratados
          path: carga-datos/tratados/
          retention-days: 7

  # 2. Imagenes: solo si las pruebas pasaron. En un pull request se construyen pero no se publican.
  imagenes:
    needs: pruebas
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [gateway, front, dominio, carga-datos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tratados
          path: carga-datos/tratados
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags (sha, latest, ep2) y la etiqueta org.opencontainers.image.revision con el commit (IE10).
      - name: Tags y etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.servicio }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build (linux/amd64) y publicacion
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
