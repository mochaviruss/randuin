# Configuracion de nginx para el front (EP3). Solo sirve los tres archivos estaticos; todo lo demas (/api, /docs) lo atiende el gateway.
# El CSP es estricto a proposito: la pagina no carga nada de afuera (sin CDN ni fuentes) y solo habla con su propio origen. Como parte de
# lo que muestra viene de un LLM, esto limita el dano aun si algun texto malicioso lograra colarse (aparte de que app.js siempre lo escribe
# como texto, nunca como HTML).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        # "$uri/" es lo que hace que "/" abra index.html: sin el, "/" se busca como si fuera un archivo y responde 404.
        try_files $uri $uri/ =404;
    }
}
