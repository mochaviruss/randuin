# Gateway de Randuin: la unica puerta del sistema. Solo este servicio publica puerto (8080).
#   /               -> front           (la pagina web)
#   /api/decision/  -> dominio         (API de Decision: reglas, base de datos, registro)
#   /api/ia/        -> ia, 2 replicas  (Motor de Inferencia: el modelo)
worker_processes 1;
events { worker_connections 1024; }

http {
    # DNS interno de Docker. Se vuelve a consultar cada 2 s: si una replica se detiene,
    # sale del reparto sola, sin reiniciar el gateway.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    # Cada linea del log dice que replica atendio y cuanto se demoro.
    log_format randuin '$remote_addr "$request" $status $request_time s -> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout randuin;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        # El gateway responde por si mismo si esta vivo (lo usa el healthcheck del compose).
        location = /health {
            default_type application/json;
            return 200 '{"gateway":"ok"}';
        }

        # Motor de Inferencia. "ia" es el nombre del servicio en el compose y Docker devuelve
        # las IP de sus 2 replicas: nginx las reparte por turnos (round robin).
        # Si una no acepta la conexion en 50 ms, o acepta pero no contesta en 60 ms (p99 medido del modelo:
        # 4 ms), reintenta en la otra: el usuario no nota la caida. 60 ms + el reintento (~5 ms) caben dentro
        # de los 100 ms que la API de Decision espera al modelo (RNF3, ADR-6).
        # non_idempotent: /predict no cambia nada (solo calcula), asi que tambien se reintenta un POST que
        # quedo a medias en una replica que se cayo en ese momento.
        location /api/ia/ {
            set $servicio "ia (Motor de Inferencia)";
            set $ia ia:8000;
            rewrite ^/api/ia/(.*)$ /$1 break;
            proxy_pass http://$ia;
            proxy_connect_timeout 50ms;
            proxy_read_timeout 60ms;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        # API de Decision (microservicio de dominio).
        location /api/decision/ {
            set $servicio "dominio (API de Decision)";
            set $dominio dominio:8000;
            rewrite ^/api/decision/(.*)$ /$1 break;
            proxy_pass http://$dominio;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }

        # Cualquier otra ruta /api/... no existe: se responde aqui, no se manda al front.
        location /api/ {
            default_type application/json;
            return 404 '{"error":"ruta no existe","ruta":"$request_uri"}';
        }

        # Front: todo lo demas.
        location / {
            set $servicio "front";
            set $front front:8080;
            proxy_pass http://$front;
            proxy_connect_timeout 1s;
        }

        # Si el servicio de destino no contesta (caido, sin replicas vivas o sin resolver su nombre),
        # el gateway responde el mismo 502 en JSON diciendo cual fue, igual que el gateway del L6.
        error_page 502 503 504 = @no_responde;
        location @no_responde {
            default_type application/json;
            return 502 '{"error":"$servicio no responde","ruta":"$request_uri"}';
        }
    }
}
